# Builds the themes, gathers the official plugins of the latest Cleitext
# release, and publishes the signed catalog.json in the "catalog" release.
name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CATALOG_PRIVATE_TOKEN: ${{ secrets.CATALOG_PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Paid themes (docs/paid-themes.md): their source and releases live in a
      # private repository, read and written with its own token.
      - name: Private themes
        if: env.CATALOG_PRIVATE_TOKEN != ''
        run: git clone --depth 1 "https://x-access-token:${CATALOG_PRIVATE_TOKEN}@github.com/faghy/cleitext-catalog-private.git" private
      - name: Cleitext of the latest release
        run: |
          tag=$(gh api repos/faghy/cleitext/releases/latest --jq .tag_name)
          git clone --depth 1 --branch "$tag" https://github.com/faghy/cleitext.git cleitext
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cleitext/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: cleitext/.nvmrc
      - name: Build the Cleitext CLI
        working-directory: cleitext
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@cleitext/cli...
      - name: Build and publish
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CLEITEXT_CLI: ${{ github.workspace }}/cleitext/packages/cli/dist/bin.js
        run: node tools/build.mjs
